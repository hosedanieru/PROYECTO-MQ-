# nginx para la SPA de MQ.
#
#   /api/*  → backend (servicio "backend" del docker-compose)
#   /*      → index.html (React Router maneja las rutas del lado del cliente)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los PDF y Excel pueden pesar; y Chromium tarda en el primer PDF.
    client_max_body_size 10m;
    proxy_read_timeout 120s;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estáticos con hash en el nombre: cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
