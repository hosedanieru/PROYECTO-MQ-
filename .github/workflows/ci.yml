# Integración continua del aplicativo MQ.
#
# En cada push y pull request:
#   backend   tipos, pruebas unitarias, pruebas de integración contra
#             PostgreSQL real, build
#   frontend  tipos, lint, build

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      # Los runners de GitHub traen Google Chrome preinstalado.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - name: Tipos
        run: npx tsc --noEmit

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas de integración
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/mq_test?schema=public"
          TZ=America/Bogota
          JWT_SECRET="secreto-de-pruebas-de-al-menos-32-caracteres-xxxxxxxx"
          JWT_EXPIRES_IN=1h
          EOF
          npm run test:e2e

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Tipos
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
